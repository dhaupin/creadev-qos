name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with sparse
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            tsconfig.json
            src
            .github
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build
