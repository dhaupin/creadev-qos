name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'none'

      - run: npm ci --no-audit
        env:
          DEBUG: '*'

      - run: npm run build
        env:
          DEBUG: '*'

      - run: npm test || true

      - run: echo "=== BUILD OUTPUT ===" && ls -la dist/ 2>/dev/null || echo "no dist"
